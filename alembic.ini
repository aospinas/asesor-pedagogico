# Migraciones de la base de datos. La dirección NO va aquí: sale de DATABASE_URL.
#   alembic upgrade head                        aplica las migraciones pendientes
#   alembic revision --autogenerate -m "texto"  crea una migración nueva a partir de app/modelos.py
[alembic]
script_location = migraciones
# Para que el comando `alembic` encuentre la carpeta app/
prepend_sys_path = .
path_separator = os
